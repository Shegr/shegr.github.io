<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выход на вторую деревню — интерактивный чеклист</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<style>
  :root{
    --bg:#14161c; --bg2:#1b1e27; --bg3:#232734;
    --line:#2e3342; --txt:#e6e8ef; --muted:#98a0b3;
    --accent:#ffd166; --green:#22c55e; --blue:#5aa9ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.45;
  }

  /* ── ЗАКРЕПЛЁННЫЙ ВЕРХ: header + табы ─────────────────────── */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 14px -8px rgba(0,0,0,.7);
  }
  header{
    padding:14px 22px 8px;
    background:linear-gradient(180deg,#1b1e27,#14161c);
    border-bottom:1px solid var(--line);
  }
  header h1{margin:0 0 2px; font-size:17px; color:#fff; font-weight:700}
  header .sub{color:var(--muted); font-size:12px}

  .tabs{
    display:flex; flex-wrap:wrap; gap:6px;
    padding:10px 22px 0;
    background:var(--bg2);
    border-bottom:1px solid var(--line);
  }
  .tab{
    padding:8px 14px; border:1px solid var(--line); border-bottom:none;
    border-radius:8px 8px 0 0; background:var(--bg3); color:var(--muted);
    cursor:pointer; font-size:13px; user-select:none;
    position:relative; top:1px;
  }
  .tab:hover{color:var(--txt)}
  .tab.active{
    background:var(--bg); color:var(--accent);
    border-color:var(--accent); border-bottom:1px solid var(--bg);
    font-weight:600;
  }

  /* ── ОСНОВНОЙ КОНТЕНТ ─────────────────────────────────────── */
  main{padding:18px 22px 60px}
  .sheet{display:none}
  .sheet.active{display:block}

  .sheet-title{
    font-size:15px; color:#fff; font-weight:700; margin:0 0 4px;
  }
  .sheet-note{color:var(--muted); font-size:12.5px; margin:0 0 14px}

  /* Двухколоночный layout: слева таблица, справа карточки */
  .layout{
    display:grid;
    grid-template-columns: minmax(0,1fr) 300px;
    gap:18px;
    align-items:start;
  }
  @media (max-width:1100px){
    .layout{grid-template-columns:1fr}
  }

  .card{
    background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    overflow:hidden;
  }
  .card h3{
    margin:0; padding:10px 14px; font-size:13px; font-weight:700;
    background:var(--bg3); color:#fff; border-bottom:1px solid var(--line);
  }
  .card .body{padding:12px 14px}

  /* ── ТАБЛИЦА ПЛАНА ────────────────────────────────────────── */
  table.plan{width:100%; border-collapse:collapse}
  table.plan th, table.plan td{
    padding:6px 10px; border-bottom:1px solid var(--line);
    text-align:left; vertical-align:top; font-size:13px;
  }
  table.plan th{
    background:var(--bg3); color:#fff; font-weight:600;
    position:sticky; top:0; z-index:2;
  }
  table.plan tbody tr:hover{background:#1f2330}
  table.plan tr.done td:not(:first-child){opacity:.45; text-decoration:line-through}
  table.plan td.gold{color:var(--accent); font-weight:600; white-space:nowrap; width:70px}
  table.plan td.note{color:var(--muted); font-size:12.5px}
  table.plan td.chk{width:34px; text-align:center}

  input[type=checkbox]{
    width:16px; height:16px; cursor:pointer; accent-color:var(--green);
    vertical-align:middle;
  }

  /* ── БОКОВАЯ КОЛОНКА: тянется по всей длине таблицы ───────── */
  .side{
    display:flex; flex-direction:column; gap:14px;
    align-self: stretch;
    height: 100%;
    position: sticky;
    top: 118px;
    max-height: calc(100vh - 130px);
    overflow-y: auto;
    padding-right: 2px;
  }
  .side .card{flex: 0 0 auto}

  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-thumb{background:#2e3342; border-radius:3px}
  .side::-webkit-scrollbar-track{background:transparent}

  table.mini{width:100%; border-collapse:collapse; font-size:12.5px}
  table.mini th, table.mini td{padding:4px 8px; border-bottom:1px solid var(--line); text-align:left}
  table.mini th{background:var(--bg3); color:#fff; font-weight:600; position:sticky; top:0}
  table.mini td:first-child{width:70px}
  table.mini td.num{text-align:right; color:var(--accent); font-weight:600; width:60px}

  .side .hint{
    background:#1e2432; border:1px solid var(--line); border-left:3px solid var(--blue);
    border-radius:6px; padding:8px 10px; color:var(--muted); font-size:12px;
  }
  .side .hint b{color:var(--txt)}

  .daily{list-style:none; padding:0; margin:0}
  .daily li{
    padding:5px 0 5px 22px; position:relative; border-bottom:1px dashed var(--line);
    font-size:12.5px;
  }
  .daily li:last-child{border-bottom:none}
  .daily li::before{
    content:"◆"; position:absolute; left:4px; top:5px; color:var(--accent); font-size:10px;
  }

  .progress{
    font-size:12px; color:var(--muted); margin-top:8px;
  }
  .progress b{color:var(--green)}

  .btn-reset{
    margin-top:10px; background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:6px; padding:5px 10px;
    font-size:12px; cursor:pointer;
  }
  .btn-reset:hover{color:#ff7b7b; border-color:#ff7b7b}

  @media (max-width:1100px){
    .side{
      position: static;
      height: auto;
      max-height: none;
      overflow: visible;
    }
  }
</style>
</head>

const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

function heroTable(){
  return `
    <table class="mini">
      <thead><tr><th>Уровень</th><th>Сила</th><th>Ресурсы</th></tr></thead>
      <tbody>
        ${HERO.map(([lvl,str,res])=>`<tr><td>${lvl}</td><td>${str}</td><td class="num">${res}</td></tr>`).join('')}
      </tbody>
    </table>`;
}
function advTable(){
  return `
    <table class="mini">
      <thead><tr><th>Прикл.</th><th>Награда</th></tr></thead>
      <tbody>
        ${ADVENTURES.map(([n,rew])=>`<tr><td>${n}</td><td>${rew}</td></tr>`).join('')}
      </tbody>
    </table>`;
}
function dailyList(){
  return `<ul class="daily">${DAILY.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}

function renderSheet(sheet, idx){
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx===0?' active':'');
  tab.textContent = sheet.tab;
  tab.dataset.id = sheet.id;
  tab.addEventListener('click', ()=> activate(sheet.id));
  tabsEl.appendChild(tab);

  const el = document.createElement('section');
  el.className = 'sheet' + (idx===0?' active':'');
  el.id = 'sheet-' + sheet.id;

  el.innerHTML = `
    <h2 class="sheet-title">${sheet.title}</h2>
    ${sheet.intro ? `<p class="sheet-note">${sheet.intro}</p>` : ''}
    <div class="layout">
      <div class="card">
        <h3>План действий</h3>
        <div class="body" style="padding:0">
          <table class="plan" data-sheet="${sheet.id}">
            <thead>
              <tr>
                <th class="chk">✅</th>
                <th>Действие</th>
                <th>Трата золота</th>
                <th>Уточнение</th>
              </tr>
            </thead>
            <tbody>
              ${sheet.plan.map((row,i)=>`
                <tr data-key="${sheet.id}_${i}">
                  <td class="chk"><input type="checkbox"></td>
                  <td>${row.act}</td>
                  <td class="gold">${row.gold||''}</td>
                  <td class="note">${row.note||''}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="body" style="border-top:1px solid var(--line)">
          <div class="progress" data-progress="${sheet.id}"></div>
          <button class="btn-reset" data-reset="${sheet.id}">Сбросить прогресс листа</button>
        </div>
      </div>

      <aside class="side">
        <div class="card">
          <h3>Качаем героя так</h3>
          <div class="body" style="padding:0">${heroTable()}</div>
        </div>
        <div class="card">
          <h3>Приключение / Награда</h3>
          <div class="body" style="padding:0">${advTable()}</div>
        </div>
        <div class="card">
          <h3>Ежедневные задания</h3>
          <div class="body">${dailyList()}</div>
        </div>
        ${sheet.heroNote ? `<div class="hint"><b>Подсказка:</b> ${sheet.heroNote}</div>` : ''}
      </aside>
    </div>
  `;

  contentEl.appendChild(el);
}

function activate(id, save=true){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.id===id));
  document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('active', s.id==='sheet-'+id));
  if(save) localStorage.setItem('travian_active_tab', id);
}

function bindCheckboxes(root){
  root.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    const tr = cb.closest('tr');
    const key = 'travian_chk_' + tr.dataset.key;
    cb.checked = localStorage.getItem(key) === '1';
    tr.classList.toggle('done', cb.checked);

    cb.addEventListener('change', ()=>{
      localStorage.setItem(key, cb.checked ? '1' : '0');
      tr.classList.toggle('done', cb.checked);
      updateProgress(tr.closest('table').dataset.sheet);
    });
  });
}

function updateProgress(sheetId){
  const table = document.querySelector(`table.plan[data-sheet="${sheetId}"]`);
  if(!table) return;
  const total = table.querySelectorAll('tbody tr').length;
  const done = table.querySelectorAll('tbody tr.done').length;
  const el = document.querySelector(`[data-progress="${sheetId}"]`);
  const pct = total ? Math.round(done/total*100) : 0;
  el.innerHTML = `Выполнено: <b>${done}</b> из ${total} (${pct}%)`;
}

function bindReset(){
  document.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.reset;
      const table = document.querySelector(`table.plan[data-sheet="${id}"]`);
      table.querySelectorAll('tbody tr').forEach(tr=>{
        const cb = tr.querySelector('input[type=checkbox]');
        cb.checked = false;
        tr.classList.remove('done');
        localStorage.removeItem('travian_chk_' + tr.dataset.key);
      });
      localStorage.removeItem('travian_scroll_' + id);
      updateProgress(id);
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
  });
}

/* init */
SHEETS.forEach(renderSheet);
bindCheckboxes(document);
SHEETS.forEach(s=>updateProgress(s.id));
bindReset();

/* ——— восстановление последней активной вкладки ——— */
const savedTab = localStorage.getItem('travian_active_tab');
if(savedTab && document.getElementById('sheet-' + savedTab)){
  activate(savedTab, false);
}

/* ——— при открытии — прыжок к первой невыполненной строке ——— */
window.addEventListener('load', ()=>{
  const activeTab = localStorage.getItem('travian_active_tab') || 'egypt';
  const table = document.querySelector(`table.plan[data-sheet="${activeTab}"]`);
  if(!table) return;

  const firstUnchecked = table.querySelector('tbody tr:not(.done)');
  if(firstUnchecked){
    setTimeout(()=>{
      const top = firstUnchecked.getBoundingClientRect().top + window.scrollY - 160;
      window.scrollTo({ top, behavior: 'auto' });
    }, 80);
  }
});
</script>
